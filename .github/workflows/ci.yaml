name: CI

on:
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check formatting
        # --ci は --no-cache と --fail-on-change を有効にする（treefmt のフラグ）。
        # nixfmt 時代の --check は treefmt に存在しない。
        run: nix fmt -- --ci

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate build
        run: nix build .#darwinConfigurations.macOS.system --dry-run
